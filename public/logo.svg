<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="gc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gv" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#060620"/>

  <!-- Frame 3 — back, violet -->
  <rect x="10" y="3" width="19" height="14" rx="2.5"
        fill="none" stroke="#7c3aed" stroke-width="1.6"
        opacity="0.55" filter="url(#gv)"/>

  <!-- Frame 2 — middle, magenta -->
  <rect x="6" y="9" width="19" height="14" rx="2.5"
        fill="#060620" stroke="#ff00ff" stroke-width="1.8"
        opacity="0.8" filter="url(#gm)"/>

  <!-- Frame 1 — front, cyan -->
  <rect x="2" y="15" width="19" height="14" rx="2.5"
        fill="#040f20" stroke="#00ffff" stroke-width="2"
        filter="url(#gc)"/>

  <!-- Front frame header accent -->
  <rect x="2" y="15" width="19" height="4" rx="2.5"
        fill="#00ffff" opacity="0.15"/>
  <rect x="2" y="17" width="19" height="2" fill="#00ffff" opacity="0.08"/>

  <!-- Three dots on front frame -->
  <circle cx="6"  cy="19" r="1.1" fill="#00ffff" opacity="0.9" filter="url(#gc)"/>
  <circle cx="9.5" cy="19" r="1.1" fill="#ff00ff" opacity="0.8" filter="url(#gm)"/>
  <circle cx="13" cy="19" r="1.1" fill="#7c3aed" opacity="0.8" filter="url(#gv)"/>
</svg>
